<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qeydiyyatdan Keçənlər</title>

<style>
body{
  margin:0;
  font-family:Poppins, sans-serif;
  background:#07111f;
  color:white;
}


.container{
  padding:20px 8%;
}


.card{
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  padding:20px;
  margin-bottom:15px;
  border-radius:15px;
  backdrop-filter:blur(10px);
  transition:0.3s;
}

.card:hover{
  transform:translateY(-5px);
  box-shadow:0 0 20px rgba(124,77,255,0.25);
}

.card p{
  margin:6px 0;
  color:#d6deeb;
}

.card b{

  color:#8fbcff;
}
  /* ===== HEADER ===== */

.header{
    position:relative;
    padding:25px 8%;
    margin-bottom:20px;
}

.header h1{
    text-align:center;
    font-size:36px;
    margin:0;
    background:linear-gradient(90deg,#7c4dff,#00d4ff);
    background-clip:text;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}
#logout-btn{
    position:absolute;
    top:25px;
    right:8%;
    padding:10px 20px;
    border:none;
    border-radius:10px;
    background:#ff4d4d;
    color:#fff;
    font-size:15px;
    cursor:pointer;
    transition:.3s;
}

#logout-btn:hover{
    background:#d63031;
}

/* ===== MƏLUMATLAR ===== */

.container h2{
    margin-bottom:15px;
    color:#8fbcff;
}

#total-users{
    margin-bottom:20px;
    font-size:18px;
    font-weight:600;
}

#search{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    margin-bottom:25px;
    background:rgba(255,255,255,.08);
    color:white;
    outline:none;
    font-size:16px;
}

#search::placeholder{
    color:#cfd8e3;
}
.delete-btn{
    position:absolute;
    top:15px;
    right:15px;

    width:35px;
    height:35px;

    border:none;
    border-radius:50%;

    background:#ff4d4d;
    color:white;

    cursor:pointer;
    font-size:16px;

    display:flex;
    justify-content:center;
    align-items:center;

    transition:.3s;
}

.delete-btn:hover{
    background:#d63031;
    transform:scale(1.1);
}
</style>

</head>

<body>

<script>
const PASSWORD = "03102024";

const entered = prompt("🔒 Admin kodunu daxil edin:");

if (entered !== PASSWORD) {
    alert("❌ Kod yanlışdır!");
    window.location.href = "index.html";
}
</script>

<div class="header">
    <h1>✨ DataPrime  ✨</h1>

    <button id="logout-btn">
         Çıxış
    </button>

</div>

<div class="container">

    <h2>📋 Qeydiyyatdan Keçənlər</h2>

    <p id="total-users">
        👥 Ümumi qeydiyyat: 0
    </p>

    <input
        type="text"
        id="search"
        placeholder="🔍 Axtar...">

    <div id="list"></div>

</div>

<script>
async function loadData() {
  try {
    const res = await fetch("/api/registrations");
    const data = await res.json();
document.getElementById("total-users").innerText =
`👥 Ümumi qeydiyyat: ${data.length}`;
    const list = document.getElementById("list");
    list.innerHTML = "";

    data.forEach(item => {
      const div = document.createElement("div");
      div.className = "card";
div.innerHTML = `
<p><b>Ad:</b> ${item.name}</p>
<p><b>Telefon:</b> ${item.phone}</p>
<p><b>Kurs:</b> ${item.course}</p>
<p><b>Tədris forması:</b> ${item.educationType || "-"}</p>

<button class="delete-btn" onclick="deleteUser('${item._id}')">
🗑
</button>
`;


      list.appendChild(div);
    });

  } catch (err) {
    document.getElementById("list").innerHTML =
      "<p>❌ Serverə qoşulmaq olmur</p>";
  }
}
async function deleteUser(id) {
    if (!confirm("Bu qeydiyyatı silmək istəyirsiniz?")) return;

    await fetch("/api/registrations/" + id, {
        method: "DELETE"
    });

    loadData();
}

loadData();
document.getElementById("logout-btn").onclick = function () {
    window.location.href = "index.html";
};
document.getElementById("search").addEventListener("input", function () {

    const value = this.value.toLowerCase();

    document.querySelectorAll(".card").forEach(card => {

        if (card.innerText.toLowerCase().includes(value)) {
            card.style.display = "block";
        } else {
            card.style.display = "none";
        }

    });

});
</script>


</body>
</html>
